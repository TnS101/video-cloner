[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-cloner"
version = "0.1.0"
description = "Canonical offline Video Cloner application package"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.scripts]
video-cloner = "video_cloner.cli:main"

[project.optional-dependencies]
test = ["pytest>=9,<10"]
default-analysis = ["numpy>=2.4,<3", "opencv-python>=4.13,<5", "scenedetect>=0.7,<0.8"]
audio = ["numpy>=1.23,<2", "librosa==0.10.1", "faster-whisper>=1.2,<2"]
ocr = ["numpy>=1.23,<2", "opencv-python==4.6.0.66", "paddleocr==2.7.3", "paddlehub==2.4.0"]

[tool.setuptools.packages.find]
include = ["video_cloner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
